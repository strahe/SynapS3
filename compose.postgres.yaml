services:
  synaps3:
    environment:
      SYNAPS3_DATABASE_DSN: postgres://synaps3:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}@127.0.0.1:${POSTGRES_PORT:-15432}/synaps3?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: synaps3
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-admin-password
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
    secrets:
      - postgres-admin-password
    configs:
      - source: synaps3-postgres-init
        target: /docker-entrypoint-initdb.d/10-synaps3.sql
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-15432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # TCP stays closed while the image runs its socket-only init server.
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=synaps3", "--dbname=synaps3"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

secrets:
  postgres-admin-password:
    file: ./.postgres-admin-password

configs:
  synaps3-postgres-init:
    file: ./docker/postgres-init.sql

volumes:
  postgres-data:
    name: synaps3-postgres-data
