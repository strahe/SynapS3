name: Docker

on:
  workflow_call:
    outputs:
      plan:
        description: CI selection plan shared by both native builds.
        value: ${{ jobs.image_amd64.outputs.plan == jobs.image_arm64.outputs.plan && jobs.image_amd64.outputs.plan || '' }}
      source-sha:
        description: Exact checked-out commit shared by both native builds.
        value: ${{ jobs.image_amd64.outputs.source-sha == jobs.image_arm64.outputs.source-sha && jobs.image_amd64.outputs.source-sha || '' }}
      docker-image:
        description: Aggregate outcome of selected native image builds and publishing.
        value: ${{ fromJSON(jobs.image_amd64.outputs.plan || '{}').docker_image == true && ((jobs.image_amd64.outputs.outcome == 'success' && jobs.image_arm64.outputs.outcome == 'success' && (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'build-only' || jobs.image_manifest.outputs.outcome == 'success')) && 'success' || 'failure') || 'skipped' }}
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        description: Manual run mode
        type: choice
        required: true
        default: build-only
        options:
          - build-only
          - publish-test

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  deployment:
    name: deployment
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ vars.RUNS_ON_AMD64 || vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Docker deployment
        env:
          SYNAPS3_REQUIRE_DOCKER_DAEMON: '1'
        run: make test-docker-entrypoint test-docker-deployment

  image_amd64:
    name: image-amd64
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.RUNS_ON_AMD64 || vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      plan: ${{ steps.plan.outputs.plan }}
      source-sha: ${{ steps.source.outputs.sha }}
      outcome: ${{ steps.build.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Resolve source revision
        id: source
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Select image checks
        id: plan
        uses: ./.github/actions/ci-plan

      - name: Build image
        id: build
        if: steps.plan.outputs.docker_image == 'true'
        uses: ./.github/actions/docker-image
        with:
          arch: amd64
          publish: ${{ github.event_name == 'push' || github.event.inputs.mode == 'publish-test' }}

  image_arm64:
    name: image-arm64
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.RUNS_ON_ARM64 || 'ubuntu-24.04-arm' }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      plan: ${{ steps.plan.outputs.plan }}
      source-sha: ${{ steps.source.outputs.sha }}
      outcome: ${{ steps.build.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Resolve source revision
        id: source
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Select image checks
        id: plan
        uses: ./.github/actions/ci-plan

      - name: Build image
        id: build
        if: steps.plan.outputs.docker_image == 'true'
        uses: ./.github/actions/docker-image
        with:
          arch: arm64
          publish: ${{ github.event_name == 'push' || github.event.inputs.mode == 'publish-test' }}

  image_manifest:
    name: image-manifest
    if: >-
      !cancelled() &&
      (github.event_name == 'push' || github.event.inputs.mode == 'publish-test') &&
      needs.image_amd64.result == 'success' && needs.image_arm64.result == 'success' &&
      needs.image_amd64.outputs.digest != '' && needs.image_arm64.outputs.digest != ''
    needs:
      - image_amd64
      - image_arm64
    runs-on: ${{ vars.RUNS_ON_AMD64 || vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      outcome: ${{ steps.manifest.outcome == 'success' && steps.inspect.outcome == 'success' && 'success' || 'failure' }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        shell: bash
        run: printf 'name=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=edge,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=ci-manual-test,enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'publish-test' }}
            type=ref,event=tag,enable=${{ github.event_name == 'push' }}

      - name: Create manifest
        id: manifest
        shell: bash
        env:
          DOCKER_METADATA_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          AMD64_DIGEST: ${{ needs.image_amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.image_arm64.outputs.digest }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=("-t" "$tag")
          done <<< "$DOCKER_METADATA_TAGS"

          if [ "${#tag_args[@]}" -eq 0 ]; then
            echo "No Docker tags resolved"
            exit 1
          fi

          docker buildx imagetools create "${tag_args[@]}" \
            "$IMAGE_NAME@$AMD64_DIGEST" "$IMAGE_NAME@$ARM64_DIGEST"

      - name: Inspect manifest
        id: inspect
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE_NAME:$IMAGE_VERSION"
