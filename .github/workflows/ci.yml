name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      verify: ${{ steps.plan.outputs.verify }}
      go_tests: ${{ steps.plan.outputs.go_tests }}
      race: ${{ steps.plan.outputs.race }}
      system: ${{ steps.plan.outputs.system }}
      dashboard: ${{ steps.plan.outputs.dashboard }}
      modules_writer: ${{ steps.plan.outputs.modules_writer }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Validate CI selection rules
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s scripts -p 'test_ci_plan.py'
          python3 -m unittest discover -s scripts -p 'test_go_cache_key.py'

      - name: Select checks
        id: plan
        uses: ./.github/actions/ci-plan

  system:
    needs: changes
    if: needs.changes.outputs.system == 'true'
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 25
    services: &postgres-service
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: synaps3_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d synaps3_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env: &postgres-env
      GOTOOLCHAIN: auto
      SYNAPS3_POSTGRES_TEST_DSN: postgres://postgres:postgres@localhost:5432/synaps3_test?sslmode=disable
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Set up Go
        id: go
        uses: ./.github/actions/setup-go

      - &restore-go-modules
        name: Restore Go modules
        id: modules_cache
        uses: actions/cache/restore@v5
        timeout-minutes: 1
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
        with:
          path: ${{ steps.go.outputs.gomodcache }}
          key: ${{ steps.go.outputs.modules-primary-key }}

      - &restore-go-build
        name: Restore compiled Go packages
        id: build_cache
        uses: actions/cache/restore@v5
        timeout-minutes: 1
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
        with:
          path: ${{ steps.go.outputs.gocache }}
          key: ${{ steps.go.outputs.build-primary-key }}
          restore-keys: ${{ steps.go.outputs.build-restore-keys }}

      - &download-go-modules
        name: Complete Go module cache
        id: modules
        if: needs.changes.outputs.modules_writer == github.job && steps.modules_cache.outputs.cache-hit != 'true'
        timeout-minutes: 2
        continue-on-error: true
        run: go mod download

      - name: Test system runtime
        id: system
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        run: make test-system

      - name: Validate report rules
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s scripts -p 'test_s3_compatibility_report.py'

      - name: Restore S3 clients
        id: clients_cache
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        uses: actions/cache/restore@v5
        timeout-minutes: 1
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
        with:
          path: ${{ runner.temp }}/synaps3-s3-clients
          key: &s3-clients-key s3-clients-v1-${{ runner.os }}-${{ runner.arch }}-aws-2.31.0-rclone-1.71.0-mc-2025-08-13-${{ hashFiles('.github/actions/setup-s3-clients/action.yml') }}

      - name: Set up pinned S3 clients
        id: clients
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        uses: ./.github/actions/setup-s3-clients

      - name: Save S3 clients
        if: ${{ !cancelled() && steps.clients.outcome == 'success' && steps.clients_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        timeout-minutes: 1
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/synaps3-s3-clients
          key: *s3-clients-key

      - name: Test documented S3 operations
        id: matrix
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        run: |
          set -o pipefail
          go test -json -trimpath -tags='dev systemtest s3compat' -count=1 \
            -run '^TestS3CompatibilityMatrix$' ./tests/system | tee "$RUNNER_TEMP/s3-matrix.json"

      - name: Test AWS CLI, rclone, and MinIO Client
        id: client-tests
        if: ${{ !cancelled() && steps.go.outcome == 'success' && steps.clients.outcome == 'success' }}
        run: |
          set -o pipefail
          go test -json -trimpath -tags='dev systemtest s3compat' -count=1 \
            -run '^TestS3Clients$' ./tests/system | tee "$RUNNER_TEMP/s3-clients.json"

      - name: Save Go caches
        if: ${{ !cancelled() && steps.go.outcome == 'success' && (steps.system.outcome == 'success' || steps.system.outcome == 'failure') }}
        uses: ./.github/actions/save-go-cache
        timeout-minutes: 2
        continue-on-error: true
        with: &save-go-cache
          gocache: ${{ steps.go.outputs.gocache }}
          gomodcache: ${{ steps.go.outputs.gomodcache }}
          build-primary-key: ${{ steps.go.outputs.build-primary-key }}
          modules-primary-key: ${{ steps.go.outputs.modules-primary-key }}
          build-cache-hit: ${{ steps.build_cache.outputs.cache-hit }}
          modules-cache-hit: ${{ steps.modules_cache.outputs.cache-hit }}
          modules-ready: ${{ steps.modules_cache.outputs.cache-hit == 'true' || steps.modules.outcome == 'success' }}
          module-writer: ${{ needs.changes.outputs.modules_writer == github.job }}

      - name: Publish compatibility summary
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/s3_compatibility_report.py \
            --matrix-json "$RUNNER_TEMP/s3-matrix.json" \
            --clients-json "$RUNNER_TEMP/s3-clients.json" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --source-sha "$SOURCE_SHA" \
            --checkout-sha "$(git rev-parse HEAD)"

  verify:
    needs: changes
    if: needs.changes.outputs.verify == 'true'
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 30
    services:
      postgres:
        image: ${{ needs.changes.outputs.go_tests == 'true' && 'postgres:18' || '' }}
        env:
          POSTGRES_DB: synaps3_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d synaps3_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env: *postgres-env

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.2

      - name: Set up Node
        id: node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Set up Go
        id: go
        uses: ./.github/actions/setup-go
        with:
          production-ui: true
          node-version: ${{ steps.node.outputs.node-version }}

      - *restore-go-modules
      - *restore-go-build
      - *download-go-modules

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          install-only: true

      - name: Verify code and build
        id: code
        run: make verify-code

      - name: Test Go packages
        id: tests
        if: ${{ !cancelled() && steps.code.outcome == 'success' && needs.changes.outputs.go_tests == 'true' }}
        run: make test GO_TEST_PACKAGE_PARALLELISM=2

      - name: Save Go caches
        if: ${{ !cancelled() && steps.go.outcome == 'success' && (steps.code.outcome == 'success' || steps.code.outcome == 'failure') }}
        uses: ./.github/actions/save-go-cache
        timeout-minutes: 2
        continue-on-error: true
        with: *save-go-cache

  race:
    needs: changes
    if: needs.changes.outputs.race == 'true'
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 8
    services: *postgres-service
    env: *postgres-env
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        id: go
        uses: ./.github/actions/setup-go
        with:
          profile: race

      - *restore-go-modules
      - *restore-go-build
      - *download-go-modules

      - name: Test shared-memory concurrency
        id: tests
        run: make test-race-ci

      - name: Save Go caches
        if: ${{ !cancelled() && steps.go.outcome == 'success' && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: ./.github/actions/save-go-cache
        timeout-minutes: 2
        continue-on-error: true
        with: *save-go-cache

  dashboard:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    services: *postgres-service
    env: *postgres-env
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.2

      - name: Set up Node
        id: node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Set up Go
        id: go
        uses: ./.github/actions/setup-go
        with:
          production-ui: true
          node-version: ${{ steps.node.outputs.node-version }}

      - *restore-go-modules
      - *restore-go-build
      - *download-go-modules

      - name: Build dashboard
        run: make ui-build

      - name: Build dashboard systemtest server
        id: server
        run: make build-systemtest-server

      - name: Install Chromium
        run: make ui-e2e-install PLAYWRIGHT_INSTALL_FLAGS=--with-deps

      - name: Test dashboard end to end
        run: make test-ui-e2e

      - name: Save Go caches
        if: ${{ !cancelled() && steps.go.outcome == 'success' && (steps.server.outcome == 'success' || steps.server.outcome == 'failure') }}
        uses: ./.github/actions/save-go-cache
        timeout-minutes: 2
        continue-on-error: true
        with: *save-go-cache

      - name: Upload Playwright diagnostics
        if: failure() && hashFiles('ui/test-results/e2e/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: ui/test-results/e2e
          if-no-files-found: ignore
          retention-days: 7

  check:
    needs: [changes, verify, race, system, dashboard]
    if: ${{ always() }}
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Require all checks to pass
        env:
          CI_PLAN: ${{ needs.changes.outputs.plan }}
          CI_RESULTS: ${{ toJSON(needs) }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 scripts/ci_plan.py check --plan "$CI_PLAN" --results "$CI_RESULTS"
