name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  postgres:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: synaps3_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d synaps3_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GOTOOLCHAIN: auto
      SYNAPS3_POSTGRES_TEST_DSN: postgres://postgres:postgres@localhost:5432/synaps3_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test PostgreSQL persistence contracts
        run: go test ./internal/db/migrations ./internal/db/repository ./internal/task -count=1

  check:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: auto

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Resolve Go cache paths
        id: go-cache
        run: |
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "goversion=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"

      - name: Restore Go cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.go-cache.outputs.gocache }}
            ${{ steps.go-cache.outputs.gomodcache }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.goversion }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.goversion }}-

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.2

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          install-only: true

      - name: Verify fast
        if: github.event_name == 'pull_request'
        run: make verify-fast

      - name: Verify no race
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: make verify-norace

      - name: Verify race
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: make verify-race

      - name: Test system runtime
        run: make test-system

      - name: Install pinned S3 clients
        run: |
          set -euo pipefail
          tools_dir="$(mktemp -d)"
          case "$(uname -m)" in
            x86_64) aws_arch=x86_64; client_arch=amd64 ;;
            aarch64|arm64) aws_arch=aarch64; client_arch=arm64 ;;
            *) echo "Unsupported S3 client architecture" >&2; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/s3-client-bin"
          curl --fail --location --retry 3 --silent --show-error \
            "https://awscli.amazonaws.com/awscli-exe-linux-${aws_arch}-2.31.0.zip" -o "$tools_dir/aws.zip"
          unzip -q "$tools_dir/aws.zip" -d "$tools_dir"
          "$tools_dir/aws/install" --install-dir "$RUNNER_TEMP/aws-cli" --bin-dir "$RUNNER_TEMP/s3-client-bin"
          curl --fail --location --retry 3 --silent --show-error \
            "https://downloads.rclone.org/v1.71.0/rclone-v1.71.0-linux-${client_arch}.zip" -o "$tools_dir/rclone.zip"
          unzip -q "$tools_dir/rclone.zip" -d "$tools_dir"
          install "$tools_dir/rclone-v1.71.0-linux-${client_arch}/rclone" "$RUNNER_TEMP/s3-client-bin/rclone"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/minio/mc/releases/download/RELEASE.2025-08-13T08-35-41Z/mc.linux-${client_arch}.RELEASE.2025-08-13T08-35-41Z" \
            -o "$RUNNER_TEMP/s3-client-bin/mc"
          chmod +x "$RUNNER_TEMP/s3-client-bin/mc"
          echo "$RUNNER_TEMP/s3-client-bin" >> "$GITHUB_PATH"

      - name: Test AWS CLI, rclone, and MinIO Client
        run: make test-s3-clients

      - name: Build dashboard systemtest server
        run: make build-systemtest-server

      - name: Install Chromium
        run: make ui-e2e-install PLAYWRIGHT_INSTALL_FLAGS=--with-deps

      - name: Test dashboard end to end
        run: make test-ui-e2e

      - name: Upload Playwright diagnostics
        if: failure() && hashFiles('ui/test-results/e2e/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: ui/test-results/e2e
          if-no-files-found: ignore
          retention-days: 7
