name: Build documentation
description: Build the documentation with the pinned Node and pnpm versions.
runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 11.1.2

    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: docs/pnpm-lock.yaml

    - name: Build docs
      shell: bash
      run: make docs-build
