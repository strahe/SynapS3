name: Set up S3 clients
description: Install and validate the pinned AWS CLI, rclone, and MinIO Client binaries.

runs:
  using: composite
  steps:
    - name: Resolve client cache
      id: paths
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        echo "root=$RUNNER_TEMP/synaps3-s3-clients" >> "$GITHUB_OUTPUT"
        echo "bin=$RUNNER_TEMP/synaps3-s3-client-bin" >> "$GITHUB_OUTPUT"

    - name: Install and validate clients
      id: install
      if: ${{ !cancelled() }}
      shell: bash
      env:
        CLIENTS_ROOT: ${{ steps.paths.outputs.root }}
      run: |
        set -euo pipefail
        clients_valid() {
          test -x "$CLIENTS_ROOT/aws/dist/aws" &&
          test -x "$CLIENTS_ROOT/rclone" && test -x "$CLIENTS_ROOT/mc" &&
          "$CLIENTS_ROOT/aws/dist/aws" --version 2>&1 | grep -F 'aws-cli/2.31.0 ' > /dev/null &&
          "$CLIENTS_ROOT/rclone" version | grep -Fx 'rclone v1.71.0' > /dev/null &&
          "$CLIENTS_ROOT/mc" --version | grep -F 'RELEASE.2025-08-13T08-35-41Z' > /dev/null
        }
        if ! clients_valid; then
          case "$(uname -m)" in
            x86_64) aws_arch=x86_64; client_arch=amd64 ;;
            aarch64|arm64) aws_arch=aarch64; client_arch=arm64 ;;
            *) echo "Unsupported S3 client architecture" >&2; exit 1 ;;
          esac
          tools_dir="$(mktemp -d)"
          trap 'rm -rf "$tools_dir"' EXIT
          rm -rf "$CLIENTS_ROOT"
          mkdir -p "$CLIENTS_ROOT"
          curl --fail --location --retry 3 --silent --show-error \
            "https://awscli.amazonaws.com/awscli-exe-linux-${aws_arch}-2.31.0.zip" -o "$tools_dir/aws.zip"
          unzip -q "$tools_dir/aws.zip" -d "$CLIENTS_ROOT"
          curl --fail --location --retry 3 --silent --show-error \
            "https://downloads.rclone.org/v1.71.0/rclone-v1.71.0-linux-${client_arch}.zip" -o "$tools_dir/rclone.zip"
          unzip -q "$tools_dir/rclone.zip" -d "$tools_dir"
          install "$tools_dir/rclone-v1.71.0-linux-${client_arch}/rclone" "$CLIENTS_ROOT/rclone"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/minio/mc/releases/download/RELEASE.2025-08-13T08-35-41Z/mc.linux-${client_arch}.RELEASE.2025-08-13T08-35-41Z" \
            -o "$CLIENTS_ROOT/mc"
          chmod +x "$CLIENTS_ROOT/mc"
          clients_valid
        fi

    - name: Expose client commands
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      shell: bash
      env:
        CLIENTS_ROOT: ${{ steps.paths.outputs.root }}
        CLIENTS_BIN: ${{ steps.paths.outputs.bin }}
      run: |
        mkdir -p "$CLIENTS_BIN"
        printf '#!/bin/sh\nexec "%s/aws/dist/aws" "$@"\n' "$CLIENTS_ROOT" > "$CLIENTS_BIN/aws"
        chmod +x "$CLIENTS_BIN/aws"
        ln -sf "$CLIENTS_ROOT/rclone" "$CLIENTS_BIN/rclone"
        ln -sf "$CLIENTS_ROOT/mc" "$CLIENTS_BIN/mc"
        echo "$CLIENTS_BIN" >> "$GITHUB_PATH"
